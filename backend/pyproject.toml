[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillhub-api"
version = "0.1.0"
description = "SkillHub FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "starlette<1.0",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic-settings",
    "python-multipart",
    "PyJWT",
    "pwdlib[argon2]",
    "email-validator",
    "httpx",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]

[project.scripts]
skillhub-seed = "app.seed:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--basetemp=.test-tmp"]
